# services.yaml — source of truth for the vendor registry.
#
# Adding a vendor = add an entry below, then save. The API watches this file
# and reloads in place: no restart, no database INSERT, no new Go code for a
# platform that is already supported.
#
# Everything here is validated before it is applied. A duplicate slug, an
# unknown kind, an unknown field or an internal URL is rejected, the error is
# logged with the offending vendor, and the previous configuration keeps
# serving.
#
# logo_url is optional and curated by hand on purpose. It is not discovered
# automatically, because a status page's own favicon is often the provider's
# generic placeholder rather than the vendor's mark. Vendors without one fall
# back to a generated globe placeholder on the site.
#
# shared_page marks a vendor that intentionally points at the same status page
# as another one, which happens when one company owns both brands. It must be
# set on BOTH vendors; an undeclared shared page is refused by the poller, and
# so is a vendor whose status page suddenly changes to a different one.
#
# Each vendor's `profile` picks an adapter together with its polling
# intervals. The available kinds are the ones declared under `profiles`.

profiles:
  # One profile serves dozens of vendors. Change the interval here and every
  # vendor using it follows.
  statuspage-v2:
    kind: statuspage
    endpoint: /api/v2/summary.json
    poll_interval_seconds: 300     # while healthy
    active_interval_seconds: 60    # while degraded or down

  # FlashDuty (flashcat.cloud) status pages. They expose no JSON API, so the
  # data has to be read from the Next.js RSC payload embedded in the HTML.
  # Note: no endpoint here, the adapter fetches the page URL itself.
  flashduty:
    kind: flashduty
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Status pages hosted by cron-job.org. The page itself is a React app that
  # POSTs to api.cron-job.org with an X-API-Method header, so there is nothing
  # to scrape. The adapter calls that API and passes the status page hostname
  # as the "domain", which is how the API knows which page to return.
  cronjob-statuspage:
    kind: cronjob
    endpoint: https://api.cron-job.org/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Slack runs its own status page with a small JSON API. It has no
  # per-component status: Slack reports a single system status plus an
  # incident history, so the adapter exposes one "All services" component.
  slack:
    kind: slack
    poll_interval_seconds: 300
    active_interval_seconds: 60

