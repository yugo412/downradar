# services.yaml — the adapter profiles.
#
# This file describes what the code can read, not which vendors are monitored.
# Vendors live in the services table; this file only says how a platform is
# polled. Adding a vendor is a database row, not an edit here.
#
# A profile names an adapter (kind), the endpoint to hit on it, and the polling
# intervals. Vendors reference a profile by name, and a vendor row can override
# the endpoint and intervals for itself.
#
# This file is validated at startup. An unknown kind, an unknown field or a
# non positive interval stops the server with a clear error.

profiles:
  # One profile serves dozens of vendors. Change the interval here and every
  # vendor using it follows.
  statuspage-v2:
    kind: statuspage
    endpoint: /api/v2/summary.json
    poll_interval_seconds: 300     # while healthy
    active_interval_seconds: 60    # while degraded or down

  # FlashDuty (flashcat.cloud) status pages. They expose no JSON API, so the
  # data has to be read from the Next.js RSC payload embedded in the HTML.
  # Note: no endpoint here, the adapter fetches the page URL itself.
  flashduty:
    kind: flashduty
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Status pages hosted by cron-job.org. The page itself is a React app that
  # POSTs to api.cron-job.org with an X-API-Method header, so there is nothing
  # to scrape. The adapter calls that API and passes the status page hostname
  # as the "domain", which is how the API knows which page to return.
  cronjob-statuspage:
    kind: cronjob
    endpoint: https://api.cron-job.org/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Slack runs its own status page with a small JSON API. It has no
  # per-component status: Slack reports a single system status plus an
  # incident history, so the adapter exposes one "All services" component.
  slack:
    kind: slack
    poll_interval_seconds: 300
    active_interval_seconds: 60
