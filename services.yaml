# services.yaml — the adapter profiles.
#
# This file describes what the code can read, not which vendors are monitored.
# Vendors live in the services table; this file only says how a platform is
# polled. Adding a vendor is a database row, not an edit here.
#
# A profile names an adapter (kind), the endpoint to hit on it, the polling
# intervals and a one line description for the management screens. Vendors
# reference a profile by name, and a vendor row can override the endpoint and
# intervals for itself.
#
# This file is validated at startup. An unknown kind, an unknown field, a
# non positive interval or a detect queue naming a profile that is not declared
# stops the server with a clear error.

# The detect queue is what makes a vendor possible to add without knowing its
# platform first. When a vendor arrives with no profile, these profiles are tried
# in this order and the first one whose adapter can read the page wins. A page
# that none of them can read is stored with the status no_match and offered to
# the queue again later, so the vendor starts working by itself once a profile
# for its platform is listed here.
#
# Only platforms that can be recognised from a url alone belong here. A bespoke
# page (opencode, flashduty, slack) would be probed on every unknown url and
# never match, so it is left out, and ping is left out because it would match
# every url there is. It is picked by hand for a service with no status page.
detect:
  - statuspage-v2
  - statusio
  - sorryapp
  - pagerduty

profiles:
  # One profile serves dozens of vendors. Change the interval here and every
  # vendor using it follows.
  statuspage-v2:
    kind: statuspage
    description: Pages hosted by Atlassian Statuspage, read from /api/v2/summary.json.
    endpoint: /api/v2/summary.json
    poll_interval_seconds: 300     # while healthy
    active_interval_seconds: 60    # while degraded or down

  # FlashDuty (flashcat.cloud) status pages. They expose no JSON API, so the
  # data has to be read from the Next.js RSC payload embedded in the HTML.
  # Note: no endpoint here, the adapter fetches the page URL itself.
  flashduty:
    kind: flashduty
    description: FlashDuty (flashcat.cloud) pages, read from the data embedded in the page.
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Status pages hosted by cron-job.org. The page itself is a React app that
  # POSTs to api.cron-job.org with an X-API-Method header, so there is nothing
  # to scrape. The adapter calls that API and passes the status page hostname
  # as the "domain", which is how the API knows which page to return.
  cronjob-statuspage:
    kind: cronjob
    description: Pages hosted by cron-job.org, read from its own API.
    endpoint: https://api.cron-job.org/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Slack runs its own status page with a small JSON API. It has no
  # per-component status: Slack reports a single system status plus an
  # incident history, so the adapter exposes one "All services" component.
  slack:
    kind: slack
    description: Slack's own status page, which reports one system status rather than components.
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # OpenCode runs a bespoke status page. It is not a Statuspage: /api/v2 does
  # not exist, and the page has its own JSON API at /api/status. Components are
  # keyed by a short slug with no display name, and incidents have generated ids
  # rather than titles, so the adapter reads the slugs as they are and takes an
  # incident title from the written note where there is one.
  opencode:
    kind: opencode
    description: OpenCode's own status page, whose components carry a slug instead of a name.
    endpoint: /api/status
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Status.io is a platform: its own page is one example and the same API serves
  # every customer. The public endpoint is /1.0/status/<page_id>, and the page id
  # is read from the page itself, so nothing has to be configured per vendor.
  # Everything else under /1.0 needs an API key and is not used.
  statusio:
    kind: statusio
    description: Pages hosted by Status.io, whose page id is read from the page itself.
    endpoint: /1.0/status/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # Sorry is a platform: Pingdom, Postmark and Sorry's own page all answer the
  # same public API. /api/v1/status gives the page and its overall state,
  # /api/v1/components the components, and /api/v1/notices the incidents and
  # maintenance. Components nest one level through parent_id.
  sorryapp:
    kind: sorryapp
    description: Pages hosted by Sorry, such as Pingdom and Postmark.
    endpoint: /api/v1/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # PagerDuty runs its own status pages and they are a platform too. The page
  # publishes a JSON API at its origin: /api/services is the component list,
  # /api/impacted_services says which of them are in trouble, /api/post_enums is
  # the vocabulary the page names its states with, and /api/posts is the
  # incident and maintenance history. Nothing has to be configured per vendor.
  pagerduty:
    kind: pagerduty
    description: PagerDuty status pages, read from the JSON API the page publishes.
    endpoint: /api/
    poll_interval_seconds: 300
    active_interval_seconds: 60

  # A profile to choose by hand, not one the detect queue can reach: it answers
  # for any url that is up, so in the queue it would take every page no other
  # profile could read. There is no status page behind it either, the target is
  # asked for itself and the answer, or the lack of one, is the report. It is the
  # profile for a service that has no status page at all.
  ping:
    kind: ping
    description: Watches any web address by asking for it, for a service with no status page.
    poll_interval_seconds: 300
    active_interval_seconds: 60
