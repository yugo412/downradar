# Production stack for downradar.info.
#
# The machine runs Caddy and the Docker daemon, and nothing else from this
# application: the containers below carry the database, the API and the Nuxt
# server. Only the web container publishes a port, and it publishes it on the
# loopback interface, so the site is reached through Caddy and not around it.
#
# The image names come from the deploy (see deploy/ship.sh) because they change
# with every release. Everything else that is specific to an install lives in
# the .env file beside this one, which compose reads on its own, the way the
# systemd units used to read EnvironmentFile.

name: downradar

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-downradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-downradar}
    volumes:
      # postgres:18 sets PGDATA=/var/lib/postgresql/18/docker and declares
      # VOLUME /var/lib/postgresql. Mounting at /var/lib/postgresql/data (as
      # with older images) creates an anonymous volume instead, and the data is
      # lost on `docker compose down`.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-downradar} -d ${POSTGRES_DB:-downradar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${API_IMAGE:?set API_IMAGE to the image to run}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The same file the systemd units used, so the secrets live in one place.
    env_file: .env
    environment:
      # The database is on the compose network, so it is dialled by its service
      # name rather than over the host loopback. This wins over whatever
      # DATABASE_URL the .env still carries for another environment.
      DATABASE_URL: postgres://${POSTGRES_USER:-downradar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-downradar}?sslmode=disable
      # The application's own cache and ephemeral state, reached by service
      # name like the database. Nothing reads it yet.
      REDIS_URL: redis://redis:6379/0
      HTTP_ADDR: ":8080"
      SERVICES_FILE: /etc/downradar/services.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The dev compose leaves this false because the dev site is http. Here the
      # cookie has to be Secure or it would travel in the clear.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Links in an email are built from this, so it has to be the public
      # address rather than localhost.
      PUBLIC_URL: ${PUBLIC_URL:-https://downradar.info}
    volumes:
      # Kept out of the image so a profile change is a file copy and a restart.
      # The profiles are read once at startup, so a change needs
      # `docker compose restart api`.
      - ./services.yaml:/etc/downradar/services.yaml:ro
      # Only the seed command reads this, and only once, when an install is
      # brought up. It is here so that command does not need a build.
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the image to run}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      # The proxy target for /api/v1/**, see frontend/server/middleware. Nitro
      # reads these when it starts, not when the image was built.
      NUXT_API_BASE: http://api:8080
      NUXT_TELEMETRY_DISABLED: "1"
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://downradar.info}
      NUXT_PUBLIC_GITHUB_REPO: ${NUXT_PUBLIC_GITHUB_REPO:-}
      # Sent as X-Internal-Token by the proxy, so the API knows this traffic is
      # ours. Same value as the API's INTERNAL_TOKEN, under the name Nitro reads.
      NUXT_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      # Loopback on purpose. A port published on 0.0.0.0 would be open to the
      # internet whatever the host firewall says, because Docker writes its own
      # forwarding rules.
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db-data:
  redis-data:
