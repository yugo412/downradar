name: deploy

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-api:latest

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NUXT_PAGE_CACHE_SECONDS=60
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-web:latest

      # The same guard the native ship.sh used to make: Nuxt inlines whatever
      # nuxt.config.ts reads at build time, so a config that started reading a
      # secret would put it in the bundle this image is about to ship.
      - name: Check that no secret was baked into the web image
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-web:${{ github.ref_name }}"
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "INTERNAL_TOKEN is not set, the bundle check is skipped" >&2
          elif docker run --rm -e INTERNAL_TOKEN --entrypoint sh "$image" \
                 -c 'grep -rqF "$INTERNAL_TOKEN" /app'; then
            echo "ERROR: the internal token is inside the bundle" >&2
            exit 1
          else
            echo "no secret found"
          fi

      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll the host to the release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-api:${{ github.ref_name }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/downradar-web:${{ github.ref_name }}
          # A package from a workflow is private by default. This job's token is
          # handed to the host so it can pull, and it expires with the job.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/ship.sh
