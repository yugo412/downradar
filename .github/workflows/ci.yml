name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: downradar
          POSTGRES_PASSWORD: downradar
          POSTGRES_DB: downradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U downradar -d downradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://downradar:downradar@127.0.0.1:5432/downradar?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        # The integration tests share one database, so packages run one at a time.
        run: go test -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject secrets in nuxt.config.ts
        run: |
          if grep -nE 'process\.env\.[A-Za-z_]*(TOKEN|SECRET|PASSWORD)' frontend/nuxt.config.ts; then
            echo "nuxt.config.ts must not read secrets: Nuxt inlines those values at build time,"
            echo "so a build done here would ship them. Use NUXT_* runtime variables instead."
            exit 1
          fi

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        env:
          NUXT_PAGE_CACHE_SECONDS: "60"
        run: npx nuxt build
