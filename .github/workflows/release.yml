name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag points at a commit main has already deployed. Publishing that
      # same image under the version keeps the release and the running site on
      # identical bits; building again would quietly let them differ.
      - name: Publish the deployed images under the version
        run: |
          for name in downradar-api downradar-web; do
            image="${{ env.REGISTRY }}/${{ github.repository_owner }}/$name"
            if ! docker pull "$image:${{ github.sha }}"; then
              echo "no image was built for ${{ github.sha }}; tag a commit that main has deployed" >&2
              exit 1
            fi
            docker tag "$image:${{ github.sha }}" "$image:${{ github.ref_name }}"
            docker tag "$image:${{ github.sha }}" "$image:latest"
            docker push "$image:${{ github.ref_name }}"
            docker push "$image:latest"
          done

      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
